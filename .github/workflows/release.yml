name: release

# Windows and Linux builds for a version tag, attached to the GitHub Release
# for that tag. The macOS build is signed, notarised and stapled on a hosted
# runner; signing material comes from the private encrypted repo
# seanperkins/rootkit-macos-certs via a read-only deploy key
# (tools/configure_macos_ci.sh sets everything up). tools/release_mac.sh
# remains the local fallback. Both sides create the release if it is missing
# and upload with --clobber, so either can run first or again.
#
# `workflow_dispatch` rehearses the signing/notarisation pipeline without
# publishing: all Publish steps are guarded to tag runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if grep -q '^config/version=' project.godot; then
            sed -i "s|^config/version=.*|config/version=\"$VERSION\"|" project.godot
          else
            sed -i "s|^config/name=\"ROOTKIT\"|config/name=\"ROOTKIT\"\nconfig/version=\"$VERSION\"|" project.godot
          fi
          grep '^config/version=' project.godot

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          godot --headless --import || true
          godot --headless --export-release windows build/windows/ROOTKIT.exe
          godot --headless --export-release linux build/linux/ROOTKIT.x86_64
          ls -la build/windows build/linux

      - name: Package
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # The updater helpers ship inside the build: the game needs them at
          # runtime to swap in the NEXT update. Linux is a .tar.gz — tar is on
          # every distro the game ships to; Windows uses built-in tar.exe.
          cp packaging/updater/windows.ps1 build/windows/updater.ps1
          cp packaging/updater/linux.sh build/linux/updater.sh
          chmod +x build/linux/updater.sh
          (cd build/windows && zip -qr "../ROOTKIT-$TAG-windows.zip" .)
          (cd build/linux && tar -czf "../ROOTKIT-$TAG-linux.tar.gz" .)
          ls -la build/*.zip build/*.tar.gz

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "ROOTKIT $TAG" --generate-notes
          gh release upload "$TAG" "build/ROOTKIT-$TAG-windows.zip" "build/ROOTKIT-$TAG-linux.tar.gz" --clobber

  macos:
    # The same export/sign/notarise/staple path tools/release_mac.sh runs
    # locally, on a hosted runner. Self-skips until the secrets are set
    # (tools/configure_macos_ci.sh); local release_mac.sh stays the fallback.
    # `secrets` is NOT available in job/step `if` expressions (see the
    # context-availability table), so a marker rides in job env instead.
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its export templates
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot.app /Applications/Godot.app
          sudo ln -sf "/Applications/Godot.app/Contents/MacOS/Godot" /usr/local/bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Stamp the version from the tag
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s|^config/version=.*|config/version=\"$VERSION\"|" project.godot
          grep '^config/version=' project.godot
          # The export preset pins an old SDK name newer runner Xcodes no
          # longer ship; snap it to whatever this host has.
          SDK=$(xcodebuild -showsdks | grep -o 'macosx[0-9.]*' | head -1)
          sed -i '' "s|^xcode/sdk_name=.*|xcode/sdk_name=\"$SDK\"|" export_presets.cfg
          echo "sdk_name=$SDK"

      # The signing material lives in seanperkins/rootkit-macos-certs, as a
      # private repo holding the password-protected p12. Same shape as
      # sound-mural-app: read-only deploy key in a secret, passphrase in
      # another; only those two small secrets live in Actions.
      - name: Authorize the certificates repo
        if: env.HAS_SIGNING == 'true'
        env:
          CERTS_DEPLOY_KEY: ${{ secrets.MACOS_CERTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CERTS_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret MACOS_CERTS_DEPLOY_KEY is unset. See tools/configure_macos_ci.sh."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CERTS_DEPLOY_KEY" > ~/.ssh/macos_certs_ed25519
          chmod 600 ~/.ssh/macos_certs_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/macos_certs_ed25519
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          git clone --depth 1 git@github.com:seanperkins/rootkit-macos-certs.git "$RUNNER_TEMP/certs"
          ls -la "$RUNNER_TEMP/certs"

      - name: Import the signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/certs/macos-signing.p12"
          [ -f "$P12" ] || { echo "::error::macos-signing.p12 missing from the certs repo"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" "$KC"
          # codesign searches the USER SEARCH LIST, not the default keychain
          # alone; without this the imported identity is invisible.
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KC"
          security import "$P12" -k "$KC" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KC"

      - name: Export
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/macos
          godot --headless --import || true
          godot --headless --export-release macos build/macos/ROOTKIT.app
          [ -d build/macos/ROOTKIT.app ] || { echo "export produced no app" >&2; exit 1; }
          # The updater helper rides INSIDE the bundle and BEFORE codesign: the
          # signature and notarization cover whatever the package ships, so a
          # helper copied in afterwards would break both.
          mkdir -p build/macos/ROOTKIT.app/Contents/Resources
          cp packaging/updater/macos.sh build/macos/ROOTKIT.app/Contents/Resources/updater.sh
          chmod +x build/macos/ROOTKIT.app/Contents/Resources/updater.sh

      - name: Sign
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: |
          set -euo pipefail
          ID="${CERT_IDENTITY:-Developer ID Application: Sean Perkins (HH3SJBAS42)}"
          codesign --force --deep --options runtime --timestamp \
            --entitlements tools/macos.entitlements \
            --sign "$ID" build/macos/ROOTKIT.app
          codesign --verify --deep --strict build/macos/ROOTKIT.app
          echo "signed as: $(codesign -dv --verbose=2 build/macos/ROOTKIT.app 2>&1 | grep Authority)"

      - name: Notarise and staple
        if: env.HAS_SIGNING == 'true'
        env:
          # Key id and issuer name a key but authorize nothing without the
          # .p8, so they are checked in here — the same convention as
          # sound-mural-app's Fastfile. Only the key content is a secret.
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_CONTENT:-}" ]; then
            echo "::error::Secret ASC_KEY_CONTENT is unset. See tools/configure_macos_ci.sh."
            exit 1
          fi
          # BSD base64 on macOS has no --decode; python3 is on every runner.
          printf '%s' "$ASC_KEY_CONTENT" | python3 -c \
            "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" \
            > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent build/macos/ROOTKIT.app "$RUNNER_TEMP/notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id 4XBH56T7RS \
            --issuer 22e2fb14-d32b-4837-92b0-6280da32716d --wait
          xcrun stapler staple build/macos/ROOTKIT.app
          xcrun stapler validate build/macos/ROOTKIT.app
          spctl --assess --type execute -v build/macos/ROOTKIT.app

      - name: Package and publish
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/ROOTKIT.app "build/ROOTKIT-$TAG-macos.zip"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "ROOTKIT $TAG" --generate-notes
          gh release upload "$TAG" "build/ROOTKIT-$TAG-macos.zip" --clobber

      # `always()`: a failed export still leaves the deploy key and the
      # decrypted certificate on the runner. A hosted runner is torn down
      # anyway, but the cleanup mirrors sound-mural-app's convention for
      # when this is ever pointed at a self-hosted Mac.
      - name: Remove the deploy key and the temporary keychain
        if: ${{ always() && env.HAS_SIGNING == 'true' }}
        run: |
          rm -f ~/.ssh/macos_certs_ed25519 ~/.ssh/config
          rm -rf "$RUNNER_TEMP/certs" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true

  feed:
    # The update manifest for the release: one signed latest.json next to the
    # three archives. After both build jobs so every asset exists; merges so a
    # job that only sees a subset (macOS local runs) never drops the others.
    # The private sign key lives in the Actions secret UPDATE_SIGN_KEY as
    # base64 PEM; generate one with tools/update_feed.sh genkey on a personal
    # machine, and keep the public key in sync with the game's embedded PUBKEY.
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release assets
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          mkdir -p build
          gh release download "$TAG" --dir build --clobber
          ls -la build

      - name: Generate and upload the feed
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGN_KEY:-}" ]; then
            echo "::error::Secret UPDATE_SIGN_KEY is unset. See tools/update_feed.sh genkey."
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          printf '%s' "$UPDATE_SIGN_KEY" | base64 -d > "$RUNNER_TEMP/update_sign.key"
          UPDATE_SIGN_KEY_FILE="$RUNNER_TEMP/update_sign.key" \
            ./tools/update_feed.sh "$TAG" --merge
          gh release upload "$TAG" build/latest.json --clobber
